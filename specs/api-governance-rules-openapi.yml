openapi: 3.1.0
info:
  title: governance-rules-api
  version: 1.0.0
  description: 'Modern API governance tooling is evolving to meet developers where they work. Governance rules can now be exposed as an MCP server, enabling seamless integration with AI-powered workflows including Copilot, agentic systems, and direct LLM integration. This approach addresses a longstanding pain point: while Spectral plugins exist for various IDEs, the installation process has historically been problematic, and teams often struggle with configuring the right ruleset for their needs and keeping those rules up to date as standards evolve. By centralizing governance rules in an MCP server, organizations can maintain a single source of truth that is automatically available across all integration points—whether a developer is working in their IDE, using an AI assistant, or running automated checks in a CI pipeline.'
  contact:
    name: Kin Lane
    email: kinlane@naftiko.io
    url: https://naftiko.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:8080/rest/Spectral+Rules+API/1.0.0
  description: Sandbox
tags:
- name: Categories
  description: Operations for listing rule categories
- name: Documentation
  description: Rules for API metadata, info object, contact information, and license details
- name: Best Practices
  description: Rules for general API design best practices
- name: Caching
  description: Rules for Cache-Control and Expires headers
- name: Compatibility
  description: Rules for version compatibility (OAS2 vs OAS3)
- name: Documentation
  description: Rules for descriptions and markdown content
- name: Error Handling
  description: Rules for error responses and RFC 7807 Problem Details
- name: Examples
  description: Rules for examples used in mocking and documentation
- name: Headers
  description: Rules for HTTP header definitions and naming conventions
- name: HTTP Methods
  description: Rules specific to HTTP methods (GET, POST, PUT, PATCH, DELETE)
- name: Naming Conventions
  description: Rules for casing patterns (camelCase, PascalCase, kebab-case)
- name: Operations
  description: Rules for operation-level concerns including summary, tags, and operationId
- name: Pagination
  description: Rules for collection pagination parameters
- name: Parameters
  description: Rules for parameter definitions, naming, and validation
- name: Paths
  description: Rules for path structure, naming conventions, versioning, and depth limits
- name: Rate Limiting
  description: Rules for rate limit headers (RateLimit-*, Retry-After)
- name: Request Response
  description: Rules for request and response body structure
- name: Responses
  description: Rules for response definitions, status codes, and content types
- name: Schemas
  description: Rules for schema definitions, types, formats, and validation
- name: Security
  description: Rules for authentication, authorization, OAuth2, and API keys
- name: Servers
  description: Rules for server URLs, HTTPS requirements, and environment configuration
- name: Validation
  description: Rules for general validation and data integrity
paths:
  /rules/best-practices:
    get:
      tags:
      - Best Practices
      summary: Retrieve Best Practices Rules
      description: Rules for general API design best practices
      operationId: getBestPracticesRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/BestPracticesRules'
  /rules/caching:
    get:
      tags:
      - Caching
      summary: Retrieve Caching Rules
      description: Rules for Cache-Control and Expires headers
      operationId: getCachingRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/CachingRules'
  /rules/compatibility:
    get:
      tags:
      - Compatibility
      summary: Retrieve Compatibility Rules
      description: Rules for version compatibility (OAS2 vs OAS3)
      operationId: getCompatibilityRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/CompatibilityRules'
  /rules/documentation:
    get:
      tags:
      - Documentation
      summary: Retrieve Documentation Rules
      description: Rules for descriptions and markdown content
      operationId: getDocumentationRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/DocumentationRules'
  /rules/error-handling:
    get:
      tags:
      - Error Handling
      summary: Retrieve Error Handling Rules
      description: Rules for error responses and RFC 7807 Problem Details
      operationId: getErrorHandlingRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/ErrorHandlingRules'
  /rules/examples:
    get:
      tags:
      - Examples
      summary: Retrieve Examples Rules
      description: Rules for examples used in mocking and documentation
      operationId: getExamplesRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/ExamplesRules'
  /rules/headers:
    get:
      tags:
      - Headers
      summary: Retrieve Headers Rules
      description: Rules for HTTP header definitions and naming conventions
      operationId: getHeadersRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/HeadersRules'
  /rules/http-methods:
    get:
      tags:
      - Http Methods
      summary: Retrieve HTTP Methods Rules
      description: Rules specific to HTTP methods (GET, POST, PUT, PATCH, DELETE)
      operationId: getHttpMethodsRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/HttpMethodsRules'
  /rules/naming-conventions:
    get:
      tags:
      - Naming Conventions
      summary: Retrieve Naming Conventions Rules
      description: Rules for casing patterns (camelCase, PascalCase, kebab-case)
      operationId: getNamingConventionsRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/NamingConventionsRules'
  /rules/operations:
    get:
      tags:
      - Operations
      summary: Retrieve Operations Rules
      description: Rules for operation-level concerns including summary, tags, and operationId
      operationId: getOperationsRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/OperationsRules'
  /rules/pagination:
    get:
      tags:
      - Pagination
      summary: Retrieve Pagination Rules
      description: Rules for collection pagination parameters
      operationId: getPaginationRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/PaginationRules'
  /rules/parameters:
    get:
      tags:
      - Parameters
      summary: Retrieve Parameters Rules
      description: Rules for parameter definitions, naming, and validation
      operationId: getParametersRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/ParametersRules'
  /rules/paths:
    get:
      tags:
      - Paths
      summary: Retrieve Paths Rules
      description: Rules for path structure, naming conventions, versioning, and depth limits
      operationId: getPathsRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/PathsRules'
  /rules/rate-limiting:
    get:
      tags:
      - Rate-limiting
      summary: Retrieve Rate Limiting Rules
      description: Rules for rate limit headers (RateLimit-*, Retry-After)
      operationId: getRateLimitingRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/RateLimitingRules'
  /rules/request-response:
    get:
      tags:
      - Request-response
      summary: Retrieve Request Response Rules
      description: Rules for request and response body structure
      operationId: getRequestResponseRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/RequestResponseRules'
  /rules/responses:
    get:
      tags:
      - Responses
      summary: Retrieve Responses Rules
      description: Rules for response definitions, status codes, and content types
      operationId: getResponsesRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/ResponsesRules'
  /rules/schemas:
    get:
      tags:
      - Schemas
      summary: Retrieve Schema rRles
      description: Rules for schema definitions, types, formats, and validation
      operationId: getSchemasRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/SchemasRules'
  /rules/security:
    get:
      tags:
      - Security
      summary: Retrieve Security Rules
      description: Rules for authentication, authorization, OAuth2, and API keys
      operationId: getSecurityRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/SecurityRules'
  /rules/servers:
    get:
      tags:
      - Servers
      summary: Retrieve Servers Rules
      description: Rules for server URLs, HTTPS requirements, and environment configuration
      operationId: getServersRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/ServersRules'
  /rules/validation:
    get:
      tags:
      - Validation
      summary: Retrieve Validation Rules
      description: Rules for general validation and data integrity
      operationId: getValidationRules
      parameters:
      - $ref: '#/components/parameters/severityFilter'
      responses:
        '200':
          $ref: '#/components/responses/ValidationRules'
  /rules:
    get:
      tags:
      - Categories
      summary: Retrieve Rule Categories
      description: Returns a summary of all available rule categories with their counts
      operationId: listCategories
      responses:
        '200':
          $ref: '#/components/responses/Categories'
components:
  schemas:
    Severity:
      type: string
      defautl: all
      enum:
      - error
      - warn
      - info
      - hint
      description: The severity level of a linting rule
    Rule:
      type: object
      description: A Spectral linting rule definition
      required:
      - category
      - severity
      properties:
        category:
          type: string
          description: The category this rule belongs to
          example: Documentation
        description:
          type: string
          description: Detailed description of what the rule checks
          example: Every API must have a description of at least 100 characters
        message:
          type: string
          description: The message shown when the rule fails
          example: API info.description must be present and at least 100 characters.
        severity:
          $ref: '#/components/schemas/Severity'
        given:
          type: string
          description: JSONPath expression for where the rule applies
          example: $.info
        formats:
          type: array
          items:
            type: string
          description: OpenAPI formats this rule applies to
          example:
          - oas3
    RulesResponse:
      type: object
      description: Response containing a map of rules for a category
      required:
      - category
      - description
      - count
      - rules
      properties:
        category:
          type: string
          description: The category name
        description:
          type: string
          description: Description of what this category covers
        count:
          type: integer
          description: Number of rules in this category
          minimum: 0
        rules:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Rule'
          description: Map of rule names to rule definitions
    Error:
      type: object
      description: RFC 7807 Problem Details error response
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
          description: A URI reference that identifies the problem type
          example: https://api.example.com/problems/not-found
        title:
          type: string
          description: A short, human-readable summary of the problem
          example: Category Not Found
        status:
          type: integer
          description: The HTTP status code
          example: 404
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence
          example: The requested category does not exist
        instance:
          type: string
          format: uri
          description: A URI reference that identifies the specific occurrence
    CategorySummary:
      type: object
      description: Summary of a rule category
      required:
      - category
      - description
      - count
      properties:
        category:
          type: string
          description: The category identifier
        description:
          type: string
          description: Description of the category
        count:
          type: integer
          description: Number of rules in this category
          minimum: 0
    CategoriesResponse:
      type: object
      description: Response containing all available categories
      required:
      - totalRules
      - totalCategories
      - categories
      properties:
        totalRules:
          type: integer
          description: Total number of rules across all categories
          minimum: 0
        totalCategories:
          type: integer
          description: Total number of categories
          minimum: 0
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategorySummary'
  responses:
    NotFound:
      description: The requested resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            Success:
              value:
                type: https://api.example.com/problems/not-found
                title: Not Found
                status: 404
                detail: The requested category does not exist
    ServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            Success:
              value:
                type: https://api.example.com/problems/internal-error
                title: Internal Server Error
                status: 500
                detail: An unexpected error occurred
    BestPracticesRules:
      description: Successful response with best-practices rules
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RulesResponse'
          examples:
            Success:
              value:
                category: best-practices
                description: Rules for general API design best practices
                count: 14
                rules:
                  extensible-enum-recommended:
                    category: best-practices
                    description: Consider using x-extensible-enum instead of enum for flexibility
                    message: Consider using x-extensible-enum instead of enum for forward compatibility.
                    severity: hint
                    given: $.paths..[?(@.type=='string')].enum
                    formats: []
                  no-uri-versioning:
                    category: best-practices
                    description: Paths must not contain version numbers - use header versioning instead
                    message: Path '{{property}}' must not contain version numbers (e.g., /v1/).
                    severity: warn
                    given: $.paths[*]~
                    formats: []
                  sub-resource-levels-limit:
                    category: best-practices
                    description: Sub-resource levels should not exceed 3
                    message: Path '{{property}}' exceeds 3 sub-resource levels.
                    severity: warn
                    given: $.paths[*]~
                    formats: []
                  resource-types-limit:
                    category: best-practices
                    description: API should limit number of resource types (max 8 recommended)
                    message: Consider limiting the number of resource types in your API.
                    severity: hint
                    given: $.paths
                    formats: []
                  standard-http-status-codes:
                    category: best-practices
                    description: Responses must use standard HTTP status codes
                    message: Status code '{{property}}' is not a standard HTTP status code.
                    severity: error
                    given: $.paths[*][*].responses[*]~
                    formats: []
                  default-response-required:
                    category: best-practices
                    description: Operations should have a default response for unexpected errors
                    message: Operation should have a 'default' response.
                    severity: warn
                    given: $.paths[*][*].responses
                    formats: []
                  default-response-problem-json:
                    category: best-practices
                    description: Default response should use application/problem+json
                    message: Default response should use application/problem+json.
                    severity: warn
                    given: $.paths[*][*].responses.default
                    formats: []
                  datetime-example-required:
                    category: best-practices
                    description: Date and time properties should have examples
                    message: Date/time property should have an example.
                    severity: warn
                    given: $.paths..[?(@.type==='string' && (@.format==='date-time' || @.format==='date' || @.format==='time'
                      || @.format==='duration'))]
                    formats: []
                  datetime-utc-format:
                    category: best-practices
                    description: Date-time examples should use UTC timezone (ending with Z)
                    message: Date-time example should use UTC format (ending with 'Z').
                    severity: warn
                    given: $.paths..[?(@.type==='string' && @.format==='date-time')].example
                    formats: []
                  number-format-valid:
                    category: best-practices
                    description: Number types must use valid formats (float, double, decimal)
                    message: 'Number format must be one of: float, double, decimal.'
                    severity: error
                    given: $.paths..[?(@.type=='number')].format
                    formats:
                    - oas3
                  integer-format-valid:
                    category: best-practices
                    description: Integer types must use valid formats (int32, int64, bigint)
                    message: 'Integer format must be one of: int32, int64, bigint.'
                    severity: error
                    given: $.paths..[?(@.type=='integer')].format
                    formats:
                    - oas3
                  standard-media-types:
                    category: best-practices
                    description: Prefer standard media types (application/json, application/problem+json)
                    message: Consider using standard media types (application/json).
                    severity: hint
                    given: $.paths[*][*].responses[*].content[*]~
                    formats: []
                  api-audience-defined:
                    category: best-practices
                    description: API should define its audience (x-audience)
                    message: API should define info.x-audience (component-internal, company-internal, external-public, etc.).
                    severity: hint
                    given: $.info
                    formats: []
                  enum-upper-snake-case:
                    category: best-practices
                    description: Enum values should use UPPER_SNAKE_CASE format
                    message: Enum value '{{value}}' should use UPPER_SNAKE_CASE.
                    severity: hint
                    given: $.paths..[?(@.type=='string')].[enum,x-extensible-enum][*]
                    formats: []
    CachingRules:
      description: Successful response with caching rules
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RulesResponse'
          examples:
            Success:
              value:
                category: caching
                description: Rules for Cache-Control and Expires headers
                count: 3
                rules:
                  cache-control-documented:
                    category: caching
                    description: Cache-Control parameters must document cache directives
                    message: Cache-Control header must document directives (max-age, private, no-store, no-cache, no-transform).
                    severity: warn
                    given: $..[parameters][?(@.in=='header' && @.name.match(/Cache-Control/i))]
                    formats:
                    - oas3
                  cache-response-headers-documented:
                    category: caching
                    description: Cache headers in responses should be documented
                    message: 'Cache headers should be documented in response. Path: {{path}}'
                    severity: hint
                    given: $.paths[*][*].responses[?(@property.match(/^2/))].headers[?(@property.match(/Cache-Control|Expires/i))]
                    formats:
                    - oas3
                  cache-headers-mutual-exclusion:
                    category: caching
                    description: Use either Cache-Control or Expires, not both (Cache-Control overrides Expires)
                    message: Use Cache-Control OR Expires, not both. Cache-Control overrides Expires when max-age is set.
                    severity: hint
                    given: $.paths[*][*].responses[?(@property.match(/^2/))].headers
                    formats:
                    - oas3
    CompatibilityRules:
      description: Successful response with compatibility rules
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RulesResponse'
          examples:
            Success:
              value:
                category: compatibility
                description: Rules for version compatibility (OAS2 vs OAS3)
                count: 1
                rules:
                  no-swagger-2:
                    category: compatibility
                    description: Swagger 2 (OpenAPI 2.0) is deprecated - use OpenAPI 3.0+
                    message: Swagger 2 is deprecated. Please upgrade to OpenAPI 3.0 or later.
                    severity: error
                    given: $
                    formats:
                    - oas2
    DocumentationRules:
      description: Successful response with documentation rules
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RulesResponse'
          examples:
            Success:
              value:
                category: documentation
                description: Rules for descriptions and markdown content
                count: 3
                rules:
                  description-not-empty:
                    category: documentation
                    description: Descriptions must not be empty
                    message: Description must not be empty or start with whitespace.
                    severity: error
                    given: $..[?(@property === 'description')]
                    formats: []
                  description-end-with-period:
                    category: documentation
                    description: Property descriptions should end with a period
                    message: Property description should end with a period.
                    severity: warn
                    given: $..properties[*].description
                    formats: []
                  description-no-email-typo:
                    category: documentation
                    description: Use 'email' not 'e-mail' in descriptions
                    message: Use 'email' instead of 'e-mail'.
                    severity: warn
                    given: $..[?(@property === 'description')]
                    formats: []
                  info-description-required:
                    category: Documentation
                    description: Every API must have a description of at least 100 characters
                    message: 'API info.description must be present and at least 100 characters. Path: {{path}}'
                    severity: error
                    given: $.info
                    formats: []
                  info-contact-required:
                    category: Documentation
                    description: API must have contact information with name, email, and URL
                    message: Missing contact {{property}}. Every API must have complete contact information.
                    severity: error
                    given: $.info.contact
                    formats: []
                  info-terms-of-service-required:
                    category: Documentation
                    description: API must reference Terms of Service URL
                    message: API must have info.termsOfService defined.
                    severity: warn
                    given: $
                    formats: []
                  info-version-semver:
                    category: Documentation
                    description: API version must follow semantic versioning (x.y.z)
                    message: Version '{{value}}' should use semantic versioning (e.g., 1.0.0).
                    severity: warn
                    given: $.info.version
                    formats: []
                  info-summary-required:
                    category: Documentation
                    description: API should have a brief one-liner summary
                    message: API should have info.x-summary (or info.summary in OAS 3.1) for catalog purposes.
                    severity: warn
                    given: $
                    formats:
                    - oas3
                  info-api-id-required:
                    category: Documentation
                    description: API should have a unique identifier for tracking
                    message: API should have info.x-api-id for unique identification.
                    severity: warn
                    given: $
                    formats: []
                  license-info-required:
                    category: Documentation
                    description: API should include license information
                    message: API should include license information in info.license.
                    severity: warn
                    given: $.info
                    formats: []
                  license-url-required:
                    category: Documentation
                    description: License should include URL
                    message: License should include a URL.
                    severity: hint
                    given: $.info.license
                    formats: []                    
    ErrorHandlingRules:
      description: Successful response with error-handling rules
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RulesResponse'
          examples:
            Success:
              value:
                category: error-handling
                description: Rules for error responses and RFC 7807 Problem Details
                count: 5
                rules:
                  error-response-rfc7807:
                    category: error-handling
                    description: Error responses should use RFC 7807 Problem Details format
                    message: Error response should use application/problem+json or application/problem+xml.
                    severity: error
                    given: $.paths[*][*].responses[?(@property.match(/^(4|5)/))].content[*]~
                    formats:
                    - oas3
                  error-400-response-body:
                    category: error-handling
                    description: 400 responses must include a response body
                    message: 400 response must include a response body.
                    severity: error
                    given: $.paths[*][*].responses["400"]
                    formats:
                    - oas3
                  error-schema-rfc7807-properties:
                    category: error-handling
                    description: Error schemas should include RFC 7807 properties (status, title, detail, type)
                    message: 'Error schema should include RFC 7807 properties (status, title, detail). Path: {{path}}'
                    severity: hint
                    given: $.paths[*][*].responses[?(@property.match(/^(4|5|default)/))].content['application/problem+json'].schema.properties
                    formats:
                    - oas3
                  error-schema-no-legacy-properties:
                    category: error-handling
                    description: Error schemas should not use legacy properties (message, msg, code) - use RFC 7807 instead
                    message: Error property '{{property}}' is non-standard. Use RFC 7807 properties (title, detail, status,
                      type).
                    severity: hint
                    given: $.paths[*][*].responses[?(@property.match(/^(4|5|default)/))].content[*].schema.properties[*]~
                    formats:
                    - oas3
                  no-explicit-5xx-codes:
                    category: error-handling
                    description: Use 'default' response instead of explicit 5xx status codes
                    message: Consider using 'default' response instead of explicit 5xx codes.
                    severity: hint
                    given: $.paths[*][*].responses[?(@property.match(/^5[0-9][0-9]$/))]
                    formats: []
    ExamplesRules:
      description: Successful response with examples rules
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RulesResponse'
          examples:
            Success:
              value:
                category: examples
                description: Rules for examples used in mocking and documentation
                count: 5
                rules:
                  required-parameter-examples:
                    category: examples
                    description: Required parameters must have examples for mocking
                    message: 'Required parameter must have examples. Path: {{path}}'
                    severity: warn
                    given: $..parameters[?(@.required==true)]
                    formats:
                    - oas3
                  optional-parameter-examples:
                    category: examples
                    description: Optional parameters should have examples
                    message: 'Optional parameter should have examples. Path: {{path}}'
                    severity: hint
                    given: $..parameters[?(@.required!=true)]
                    formats:
                    - oas3
                  request-body-examples:
                    category: examples
                    description: Request body content should have examples
                    message: 'Request body content should have examples. Path: {{path}}'
                    severity: warn
                    given: $.paths[*][*].requestBody.content[*]
                    formats:
                    - oas3
