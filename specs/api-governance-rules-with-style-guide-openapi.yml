  /guidelines:
    get:
      tags:
      - Introduction
      summary: List all guideline sections
      description: Returns a list of all guideline sections
      operationId: listGuidelines
      parameters:
      - name: severity
        in: query
        description: Filter rules by severity level
        schema:
          type: string
          enum:
          - error
          - warn
          - info
          - hint
      - name: requirement
        in: query
        description: Filter rules by requirement level
        schema:
          type: string
          enum:
          - MUST
          - MUST NOT
          - SHOULD
          - SHOULD NOT
          - MAY
      responses:
        '200':
          description: List of guideline sections
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/GuidelineSectionSummary'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
              examples:
                ListGuidelines:
                  $ref: '#/components/examples/ListGuidelines'
  /guidelines/search:
    get:
      tags:
      - Introduction
      summary: Search guidelines
      description: Search across all guidelines by keyword
      operationId: searchGuidelines
      parameters:
      - name: q
        in: query
        required: true
        description: Search query
        schema:
          type: string
          minLength: 2
      - name: limit
        in: query
        description: Maximum results to return
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  totalResults:
                    type: integer
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
              examples:
                SearchGuidelines:
                  $ref: '#/components/examples/SearchGuidelines'
  /guidelines/rules:
    get:
      tags:
      - Introduction
      summary: List all rules
      description: Returns all individual rules across all sections
      operationId: listRules
      parameters:
      - name: severity
        in: query
        description: Filter by severity
        schema:
          type: string
          enum:
          - error
          - warn
          - info
      - name: requirement
        in: query
        description: Filter by requirement level
        schema:
          type: string
          enum:
          - MUST
          - MUST NOT
          - SHOULD
          - SHOULD NOT
          - MAY
      - name: spectralRule
        in: query
        description: Filter rules that have Spectral implementations
        schema:
          type: boolean
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: List of rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/Rule'
