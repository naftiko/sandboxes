openapi: 3.1.0
info:
  title: api-governance-rules-with-style-guide
  version: 1.0.0
  description: A self-documenting API that serves API design guidelines and best practices. This API presents the Unified API Style Guide as queryable resources, with each guideline section available as an endpoint. The API itself follows the guidelines it documents, serving as a living example of the principles it describes.
  contact:
    name: Kin Lane
    email: kinlane@naftiko.io
    url: https://naftiko.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:8080/rest/api-governance-rules-with-style-guide/1.0.0
  description: Sandbox
tags:
- name: Introduction
  description: Introduction and overview of the API style guide
- name: Design Principles
  description: Core design principles for API development
- name: URL Structure
  description: Guidelines for URL and path design
- name: Naming Conventions
  description: Naming rules for properties, parameters, and headers
- name: HTTP Methods
  description: Proper usage of HTTP methods
- name: HTTP Status Codes
  description: Standard HTTP status code usage
- name: Request Response
  description: Request and response format guidelines
- name: Data Types
  description: Data type and format specifications
- name: Collections
  description: Collection and pagination patterns
- name: Filtering Sorting
  description: Filtering and sorting guidelines
- name: Error Handling
  description: Error response formats and handling
- name: Versioning
  description: API versioning strategies
- name: Security
  description: Security requirements and best practices
- name: Hypermedia
  description: HATEOAS and link relations
- name: Long Running Operations
  description: Async operation patterns
- name: Webhooks
  description: Webhook and push notification guidelines
- name: Caching
  description: Caching strategies and headers
- name: Compatibility
  description: Backwards compatibility and evolution
- name: Deprecation
  description: Deprecation process and communication
- name: Standards
  description: Technical standards, specifications, and conventions referenced in the style guide
security:
- apiKey: []
paths:
  /guidelines/introduction:
    get:
      tags:
      - Introduction
      summary: Get introduction overview
      description: Returns the introduction and purpose of the API style guide
      operationId: getIntroduction
