      summary: List all standards categories
      description: Returns all categories of technical standards referenced in the API style guide
      operationId: listStandards
      responses:
        '200':
          description: List of standards categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardsIndex'
              examples:
                StandardsIndex:
                  $ref: '#/components/examples/StandardsIndex'
  /standards/rfc:
    get:
      tags:
      - Standards
      summary: Get RFC Standards (IETF)
      description: Internet Engineering Task Force Request for Comments specifications that define core internet protocols
        and best practices for HTTP APIs.
      operationId: getRfcStandards
