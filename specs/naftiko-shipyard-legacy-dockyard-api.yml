openapi: 3.1.0
info:
  title: naftiko-shipyard-legacy-dockyard-api
  description: >-
    Legacy dockyard system that holds records for older vessels that were never
    migrated to the modern Maritime Registry. Authenticated via API key
    passed in the X-Dock-Key header.
  version: 1.0.0-alpha1
  contact:
    name: Shipyard API Team

servers:
  - url: https://mocks.naftiko.net/rest/naftiko-shipyard-legacy-dockyard-api/1.0.0-alpha1/
    description: Legacy Dockyard API

tags:
  - name: Vessels
    description: Legacy vessel registry operations for listing dockyard records

security:
  - apiKeyAuth: []

paths:
  /vessels:
    get:
      tags:
        - Vessels
      operationId: list-vessels
      summary: List vessels from the legacy dockyard
      description: >-
        Returns a list of vessels from the legacy dockyard system.
        These are older vessel records that were never migrated to the
        modern Maritime Registry. Can be filtered by operational status.
      x-microcks-operation:
        dispatcher: FALLBACK
        dispatcherRules: |-
          {
            "dispatcher": "URI_PARAMS",
            "dispatcherRules": "status",
            "fallback": "allVessels"
          }
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by operational status
          schema:
            type: string
            enum:
              - active
              - laid_up
              - scrapped
          examples:
            "?status=active":
              value: "active"
            "?status=laid_up":
              value: "laid_up"
      responses:
        '200':
          description: A list of legacy vessels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegacyVessel'
              examples:
                allVessels:
                  summary: All legacy vessels
                  value:
                    - vesselCode: "LEGACY-4012"
                      vesselName: "Old Faithful"
                      category: "cargo"
                      flagState: "GB"
                      operationalStatus: "active"
                    - vesselCode: "LEGACY-2087"
                      vesselName: "Iron Maiden"
                      category: "bulk_carrier"
                      flagState: "PA"
                      operationalStatus: "laid_up"
                "?status=active":
                  summary: Active legacy vessels only
                  value:
                    - vesselCode: "LEGACY-4012"
                      vesselName: "Old Faithful"
                      category: "cargo"
                      flagState: "GB"
                      operationalStatus: "active"
                "?status=laid_up":
                  summary: Laid up legacy vessels
                  value:
                    - vesselCode: "LEGACY-2087"
                      vesselName: "Iron Maiden"
                      category: "bulk_carrier"
                      flagState: "PA"
                      operationalStatus: "laid_up"

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Dock-Key
      description: API key for legacy dockyard access

  schemas:
    LegacyVessel:
      type: object
      description: >-
        Legacy vessel record. Uses different field naming conventions
        than the modern Maritime Registry (camelCase vs snake_case,
        different field names for equivalent concepts).
      required:
        - vesselCode
        - vesselName
        - category
        - flagState
        - operationalStatus
      properties:
        vesselCode:
          type: string
          description: Legacy vessel identifier code
          example: "LEGACY-4012"
        vesselName:
          type: string
          description: Name of the vessel
          example: "Old Faithful"
        category:
          type: string
          description: >-
            Vessel category (equivalent to vessel_type in the modern registry)
          enum:
            - cargo
            - tanker
            - bulk_carrier
            - container
            - passenger
          example: "cargo"
        flagState:
          type: string
          description: >-
            ISO country code of the flag state (equivalent to flag_code
            in the modern registry)
          example: "GB"
        operationalStatus:
          type: string
          description: >-
            Current operational status. Uses different values than the
            modern registry (e.g. laid_up, scrapped instead of
            maintenance, decommissioned).
          enum:
            - active
            - laid_up
            - scrapped
          example: "active"
